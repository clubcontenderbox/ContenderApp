<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Contender · Admin actualizado</title>
<style>
html,body{height:100%;margin:0;background:#080808;color:#f0ede8;font-family:Arial,sans-serif}
#boot{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center}
#boot b{color:#c8f135;font-size:28px}#boot small{color:#777;max-width:360px;line-height:1.5}
</style>
</head>
<body>
<div id="boot"><b>CONTENDER</b><div>Cargando administrador actualizado…</div><small>Este archivo usa como base <code>admin_membresias_calendario.html</code> de la misma carpeta y aplica las mejoras de número de socio y saldo.</small></div>
<script>
(function(){
'use strict';
var PATCH = String.raw`
// ═══════════════════════════════════════════════════════════════
// PARCHE CONTENDER 2026-08-07
// - Edición segura de número de socio
// - Saldo/monedero con movimientos
// - Saldo automático por check-in
// - Pago de productos con saldo
// - Orden de socios descendente y sugerencia de siguiente número
// ═══════════════════════════════════════════════════════════════

CONFIG.SALDO_POR_CHECKIN = 10; // Cambia aquí el importe que gana cada check-in.
ordenAsc = false;

// Proponer el siguiente número conservando ceros a la izquierda.
var _abrirNuevoSocBase = abrirNuevoSoc;
abrirNuevoSoc = function(){
  _abrirNuevoSocBase();
  var nums=SOCIOS.map(function(s){return /^\d+$/.test(String(s.id))?Number(s.id):null;}).filter(function(n){return n!==null;});
  var max=nums.length?Math.max.apply(null,nums):0;
  var ancho=SOCIOS.reduce(function(a,s){return /^\d+$/.test(String(s.id))?Math.max(a,String(s.id).length):a;},3);
  ge('f-id').value=String(max+1).padStart(ancho,'0');
};

// Permitir editar el número de socio.
abrirEditarSoc = function(id){
  var s=SOCIOS.find(function(x){return x.id===id;}); if(!s) return;
  socEditId=id; ge('form-titulo').textContent='Editar Socio';
  ge('f-id').value=s.id; ge('f-id').disabled=false;
  ge('f-nombre').value=s.nombre; ge('f-ap').value=s.apellido_paterno; ge('f-am').value=s.apellido_materno||'';
  ge('f-tel').value=s.numero||''; ge('f-emerg').value=s.numero_emergencia||''; ge('f-correo').value=s.correo||'';
  ge('f-notas').value=s.notas||''; ge('f-inicio').value=s.fecha_inicio||'';
  ge('f-nac').value=s.fecha_nacimiento||''; ge('f-sexo').value=s.sexo||'';
  showScreen('form');
};

guardarSoc = async function(){
  var id=ge('f-id').value.trim(), nombre=ge('f-nombre').value.trim(), ap=ge('f-ap').value.trim();
  if(!id||!nombre||!ap){alert('Número, nombre y apellido son requeridos');return;}
  var oldId=socEditId ? String(socEditId) : null;
  var duplicado=SOCIOS.find(function(x){return String(x.id)===id && String(x.id)!==oldId;});
  if(duplicado){alert('Ya existe un socio con el número '+id);return;}
  var esNuevo=!oldId;

  if(oldId && id!==oldId){
    if(!confirm('¿Cambiar el número de socio de '+oldId+' a '+id+'? Se actualizará todo su historial relacionado.')) return;
    var ok=await GymDB.cambiarNumeroSocio(oldId,id);
    if(!ok){alert('No se pudo cambiar el número de socio. Revisa que hayas ejecutado el SQL incluido en supabasedb_actualizado.txt.');return;}
    SOCIOS=GymDB.getSocios(); DEUDAS=GymDB.getAllDeudas(); CHECKINS=GymDB.getTodayCheckins(); VENTAS=GymDB.getVentas();
    socEditId=id;
  }

  var existente=SOCIOS.find(function(x){return String(x.id)===id;});
  var datos={id:id,nombre:nombre,apellido_paterno:ap,apellido_materno:ge('f-am').value.trim(),
    numero:ge('f-tel').value.replace(/\D/g,'').trim(),numero_emergencia:ge('f-emerg').value.trim(),correo:ge('f-correo').value.trim(),
    notas:ge('f-notas').value.trim(),fecha_inicio:ge('f-inicio').value,
    fecha_vencimiento:existente?existente.fecha_vencimiento:'',
    fecha_nacimiento:ge('f-nac').value,plan:existente?existente.plan:'',sexo:ge('f-sexo').value,
    visitas:existente?existente.visitas:0, activo:existente?existente.activo:true,
    abonos:existente?(existente.abonos||[]):[]};
  GymDB.setSocio(datos);
  SOCIOS=GymDB.getSocios();
  socioActual=SOCIOS.find(function(x){return String(x.id)===id;});
  socEditId=null;
  if(esNuevo){detTab='membresia';showScreen('detalle');} else showScreen('socios');
};

// Check-in: además de visitas, suma el importe configurado al monedero.
registrarCheckinPorCodigo = function(codigo){
  var s=buscarSocioCI(codigo);
  if(!s){return {ok:false,msg:'Socio no encontrado'};}
  var agregado=GymDB.addCheckin(s.id,CONFIG.SALDO_POR_CHECKIN);
  if(!agregado){return {ok:false,msg:s.nombre+' ya tiene check-in hoy'};}
  CHECKINS=GymDB.getTodayCheckins(); SOCIOS=GymDB.getSocios();
  return {ok:true,socio:s};
};

function _insertarModalSaldo(){
  if(ge('modal-saldo')) return;
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal-ov" id="modal-saldo"><div class="modal">'+
    '<div class="mhandle"></div><h2 id="saldo-modal-titulo">Abonar saldo</h2>'+
    '<div class="fr"><label>Monto</label><input type="number" id="saldo-monto" min="0.01" step="0.01" inputmode="decimal" placeholder="0"></div>'+
    '<div class="fr"><label>Concepto</label><input type="text" id="saldo-concepto" placeholder="Ej. Abono en efectivo"></div>'+
    '<div id="saldo-disponible" style="font-size:12px;color:var(--muted);margin:6px 0 4px"></div>'+
    '<div class="mbtns"><button class="btn bd" style="flex:1;padding:13px" id="saldo-cancelar">Cancelar</button><button class="btn bl" style="flex:1;padding:13px" id="saldo-guardar">Confirmar</button></div>'+
    '</div></div>');
  ge('saldo-cancelar').addEventListener('click',function(){ge('modal-saldo').classList.remove('open');});
  ge('saldo-guardar').addEventListener('click',guardarMovimientoSaldo);
  ge('modal-saldo').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
}
var saldoModo='abono';
function abrirSaldoModal(modo,s){
  saldoModo=modo; socioActual=s;
  ge('saldo-modal-titulo').textContent=modo==='abono'?'Abonar saldo':'Cobrar saldo';
  ge('saldo-monto').value='';
  ge('saldo-concepto').value=modo==='abono'?'Abono manual':'Cobro manual';
  ge('saldo-disponible').textContent='Saldo disponible: '+fm(GymDB.getSaldo(s.id));
  ge('modal-saldo').classList.add('open');
  setTimeout(function(){ge('saldo-monto').focus();},100);
}
function guardarMovimientoSaldo(){
  var s=socioActual;if(!s)return;
  var monto=Number(ge('saldo-monto').value||0), concepto=ge('saldo-concepto').value.trim();
  if(!(monto>0)){alert('Ingresa un monto válido');return;}
  if(saldoModo==='cargo' && monto>GymDB.getSaldo(s.id)){alert('Saldo insuficiente. Disponible: '+fm(GymDB.getSaldo(s.id)));return;}
  GymDB.addSaldoMovimiento(s.id,saldoModo==='cargo'?-monto:monto,saldoModo==='cargo'?'cargo':'abono',concepto||null);
  ge('modal-saldo').classList.remove('open');
  renderDetalle();
}
function _htmlMovimientosSaldo(s){
  var movs=GymDB.getSaldoMovimientos(s.id).slice(0,20);
  if(!movs.length) return '<div style="font-size:12px;color:var(--muted);padding:8px 0">Sin movimientos todavía</div>';
  var h='<div class="card">';
  movs.forEach(function(m){
    var pos=Number(m.monto)>=0;
    h+='<div class="abono-row"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+(m.concepto||m.tipo||'Movimiento')+'</div>'+
      '<div style="font-size:11px;color:var(--muted)">'+fF(m.fecha)+(m.hora?' · '+String(m.hora).slice(0,5):'')+'</div></div>'+
      '<div style="font-family:\"Bebas Neue\",sans-serif;font-size:18px;color:'+(pos?'var(--green)':'var(--orange)')+'">'+(pos?'+':'-')+fm(Math.abs(Number(m.monto)||0))+'</div></div>';
  });
  return h+'</div>';
}

// Extender Información sin reemplazar el resto de la ficha ni composición corporal.
var _renderTabInfoBase=renderTabInfo;
renderTabInfo=function(s){
  _renderTabInfoBase(s);
  var sec=ge('det-content').querySelector('.sec'); if(!sec)return;
  var bloque=document.createElement('div');
  bloque.innerHTML='<div class="card lime" style="margin:4px 0 14px">'+
    '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px">Saldo</div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px"><div style="font-family:\"Bebas Neue\",sans-serif;font-size:34px;color:var(--lime)">'+fm(GymDB.getSaldo(s.id))+'</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn bg2b bsm" id="btn-saldo-abonar">+ Abonar</button><button class="btn bd bsm" id="btn-saldo-cobrar">Cobrar</button></div></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:4px">Cada check-in suma '+fm(CONFIG.SALDO_POR_CHECKIN)+' automáticamente.</div></div>'+
    '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:14px 0 8px">Movimientos de saldo</div>'+_htmlMovimientosSaldo(s);
  sec.insertBefore(bloque,sec.firstChild);
  ge('btn-saldo-abonar').addEventListener('click',function(){abrirSaldoModal('abono',s);});
  ge('btn-saldo-cobrar').addEventListener('click',function(){abrirSaldoModal('cargo',s);});
};

// Agregar "Pagar con saldo" al modal de productos.
var _abrirModalProdSocBase=abrirModalProdSoc;
abrirModalProdSoc=function(s){
  _abrirModalProdSocBase(s);
  var st=ge('ps-status');
  if(st && !Array.from(st.options).some(function(o){return o.value==='saldo';})){
    var o=document.createElement('option');o.value='saldo';o.textContent='Pagar con saldo';st.appendChild(o);
  }
};

guardarProdSoc=function(){
  var s=socioActual;if(!s)return;
  var p=PRODUCTOS.find(function(x){return x.id===+ge('ps-producto').value;});
  if(!p){alert('Selecciona un producto');return;}
  var cant=+ge('ps-cantidad').value||1;
  if(cant>p.stock){alert('Stock insuficiente. Disponible: '+p.stock);return;}
  var trainer=ge('ps-trainer').value;if(!trainer){alert('Selecciona el entrenador responsable');return;}
  var fecha=hoyISO(), total=p.costo*cant, metodo=ge('ps-status').value;
  if(metodo==='saldo'){
    var saldo=GymDB.getSaldo(s.id);
    if(total>saldo){alert('Saldo insuficiente. Disponible: '+fm(saldo));return;}
    GymDB.addSaldoMovimiento(s.id,-total,'cargo','Compra: '+p.nombre+(cant>1?' x'+cant:''));
  } else if(metodo==='debe'){
    GymDB.addDeuda(s.id,{id:'d'+(nextDeuId++),producto:p.nombre,total:total,fecha:fecha,trainer:trainer,tipo:'producto'});
    DEUDAS=GymDB.getAllDeudas();
  }
  crearVenta({socio_id:s.id,socio_nombre:s.nombre+' '+s.apellido_paterno,producto:p.nombre,cantidad:cant,total:total,fecha:fecha,status:metodo==='debe'?'debe':'pagado',tipo:'prod',trainer:trainer});
  p.stock=p.stock-cant;GymDB.saveProductos(PRODUCTOS);PRODUCTOS=GymDB.getProductos();
  ge('modal-prod-soc').classList.remove('open');renderDetalle();
};

document.addEventListener('DOMContentLoaded',function(){
  _insertarModalSaldo();
  var b=ge('btn-orden-dir');if(b)b.textContent='↓';
  var s=ge('sort-sel');if(s)s.value='id';
});
`;

fetch('admin_membresias_calendario.html',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
  .then(function(html){
    var close='</'+'script>';
    var inject='<script>'+PATCH+close;
    if(html.indexOf('</body>')<0) throw new Error('El admin base no contiene </body>');
    html=html.replace('</body>',inject+'\n</body>');
    document.open();document.write(html);document.close();
  })
  .catch(function(err){
    document.getElementById('boot').innerHTML='<b style="color:#ff3b30">No se pudo cargar el admin base</b><div>'+String(err.message||err)+'</div><small>Coloca este archivo en la misma carpeta que <code>admin_membresias_calendario.html</code>. Si lo abres directamente como archivo local y el navegador bloquea fetch(), súbelo al mismo hosting donde usas actualmente el admin.</small>';
  });
})();
</script>
</body>
</html>
