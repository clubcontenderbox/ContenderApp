<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Contender · Entrenador</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="supabasedb.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080808;color:#F0EDE8;font-family:"DM Sans",sans-serif;max-width:430px;margin:0 auto;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root{--bg:#080808;--bg2:#111;--bg3:#1A1A1A;--border:#2A2A2A;--muted:#666;--text:#F0EDE8;--lime:#C8F135;--green:#30D158;--orange:#FF9F0A;--red:#FF3B30;--wa:#25D366;}
.screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:76px;animation:fadeIn .2s ease;}
.screen.active{display:flex;}
.screen-full{display:none;flex-direction:column;min-height:100vh;}
.screen-full.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* NAV */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,8,8,.96);border-top:1px solid var(--border);display:flex;z-index:200;padding:6px 0 18px;backdrop-filter:blur(16px);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;color:#444;font-size:8px;font-family:"DM Sans",sans-serif;font-weight:500;transition:color .15s;padding:4px 0;}
.nav-item.active{color:var(--lime);}
.nav-icon{font-size:18px;line-height:1;}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;background:radial-gradient(ellipse 80% 50% at 50% 105%,rgba(200,241,53,.1),transparent 68%);}
.login-marca{font-family:"Bebas Neue",sans-serif;font-size:56px;line-height:.9;letter-spacing:-2px;background:linear-gradient(160deg,#fff 25%,var(--lime));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
.login-rol{font-size:11px;color:var(--lime);letter-spacing:4px;text-transform:uppercase;margin-bottom:40px;}
.pin-dots{display:flex;gap:14px;margin:12px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .15s;}
.pin-dot.filled{background:var(--lime);border-color:var(--lime);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:260px;}
.pin-key{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:17px;font-size:22px;font-weight:700;color:var(--text);cursor:pointer;font-family:"DM Sans",sans-serif;transition:background .1s;}
.pin-key:active{background:var(--border);}
.pin-key.sm{font-size:13px;color:var(--muted);}
/* HEADER */
.hdr{padding:18px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.hdr h1{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:.5px;line-height:1;}
.hdr small{font-size:12px;color:var(--muted);display:block;margin-top:2px;}
.hdr-r{display:flex;gap:7px;align-items:center;flex-shrink:0;}
/* TABS */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 13px 10px;font-size:12px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab.active{color:var(--lime);border-bottom-color:var(--lime);}
/* CARDS */
.card{background:var(--bg2);border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--border);}
.card.lime{border-color:rgba(200,241,53,.25);background:rgba(200,241,53,.04);}
.card.verde{border-color:rgba(48,209,88,.3);background:rgba(48,209,88,.04);}
.card.naranja{border-color:rgba(255,159,10,.35);background:rgba(255,159,10,.04);}
.card.roja{border-color:rgba(255,59,48,.35);background:rgba(255,59,48,.04);}
/* SOC CARD */
.soc-card{background:var(--bg2);border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--border);}
.soc-card.aldia{border-left:3px solid var(--green);}
.soc-card.vencehoy{border-left:3px solid var(--orange);}
.soc-card.pendiente{border-left:3px solid var(--orange);}
.soc-card.vencido{border-left:3px solid var(--red);}
.soc-fila{display:flex;align-items:center;gap:10px;}
.soc-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#080808;flex-shrink:0;}
.soc-info{flex:1;min-width:0;}
.soc-nombre{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.soc-sub{font-size:11px;color:var(--muted);margin-top:2px;}
/* CI ROW */
.ci-row{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:6px;border:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;}
.ci-av{width:32px;height:32px;border-radius:50%;background:var(--lime);color:#080808;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* ABONO */
.abono-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.abono-row:last-child{border-bottom:none;}
.abono-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.aok{background:rgba(48,209,88,.15);color:var(--green);}
.apend{background:rgba(255,159,10,.15);color:var(--orange);}
.avenc{background:rgba(255,59,48,.15);color:var(--red);}
/* PILLS */
.pill{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap;}
.pg{background:rgba(48,209,88,.15);color:var(--green);}
.po{background:rgba(255,159,10,.15);color:var(--orange);}
.pr{background:rgba(255,59,48,.15);color:var(--red);}
.pm{background:var(--bg3);color:var(--muted);}
/* BTNS */
.btn{border:none;border-radius:10px;padding:8px 13px;font-family:"DM Sans",sans-serif;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .1s;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.bl{background:var(--lime);color:#080808;}
.bd{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.bwa{background:var(--wa);color:#fff;}
.br{background:rgba(255,59,48,.12);color:var(--red);border:1px solid rgba(255,59,48,.3);}
.bg2b{background:rgba(48,209,88,.12);color:var(--green);border:1px solid rgba(48,209,88,.3);}
.bsm{padding:6px 10px;font-size:11px;border-radius:8px;}
.bfull{width:100%;padding:13px;font-size:14px;justify-content:center;border-radius:12px;}
/* SORT */
.sort-wrap{padding:0 16px;margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.sort-lbl{font-size:11px;color:var(--muted);white-space:nowrap;}
/* FORM */
.sec{padding:0 16px;}
.fr{margin-bottom:12px;}
.fr label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--text);font-size:14px;font-family:"DM Sans",sans-serif;width:100%;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--lime);}
::placeholder{color:#444;}
textarea{resize:vertical;min-height:70px;}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px);}
.modal-ov.open{display:flex;}
.modal{background:var(--bg2);border-radius:22px 22px 0 0;padding:24px 16px 36px;width:100%;max-width:430px;border:1px solid var(--border);border-bottom:none;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal h2{font-family:"Bebas Neue",sans-serif;font-size:24px;margin-bottom:16px;}
.mbtns{display:flex;gap:8px;margin-top:16px;}
/* PROG */
.prog-wrap{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:4px;background:var(--lime);transition:width .6s;}
/* CLASE CARD */
.clase-card{display:flex;align-items:stretch;margin-bottom:8px;background:var(--bg2);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
.clase-body{flex:1;padding:12px 13px;}
/* PERIODOS VENTAS */
.periodo-wrap{display:flex;gap:8px;align-items:center;padding:0 16px;margin-bottom:10px;}
.periodo-wrap label{font-size:11px;color:var(--muted);white-space:nowrap;}
/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-bottom:22px;position:relative;margin-top:8px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative;}
.bfill{width:100%;border-radius:4px 4px 0 0;min-height:4px;}
.blabel{position:absolute;bottom:-18px;font-size:9px;color:var(--muted);}
.bval{position:absolute;top:-15px;font-size:9px;color:var(--lime);font-weight:700;}
/* STAT */
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px;margin-bottom:12px;}
.sbox{background:var(--bg2);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--border);}
.snum{font-family:"Bebas Neue",sans-serif;font-size:22px;line-height:1;}
.slbl{font-size:9px;color:var(--muted);margin-top:3px;}
/* DIAS SELECTOR */
.dias-sel{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.dia-btn{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.dia-btn.on{background:rgba(200,241,53,.15);color:var(--lime);border-color:var(--lime);}
/* VENTA CARD */
.venta-card{background:var(--bg2);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);}
.venta-card.debe{border-left:3px solid var(--orange);}
.venta-card.pagado{border-left:3px solid var(--green);}
/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:var(--muted);}
.empty .ico{font-size:36px;margin-bottom:10px;}
.empty p{font-size:13px;}
.nav-ph{height:76px;}
</style>
</head>
<body>

<!-- ═══ OVERLAY DE CARGA ═══════════════════════════════════════ -->
<div id="ov-loading" style="position:fixed;inset:0;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:12px">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;color:#C8F135;letter-spacing:3px">CONTENDER</div>
  <div style="font-family:'DM Sans',sans-serif;font-size:13px;color:#555">Conectando con Supabase…</div>
  <div id="ov-err" style="font-size:11px;color:#FF3B30;display:none;max-width:280px;text-align:center"></div>
</div>

<!-- ═══ LOGIN ENTRENADOR (teléfono + código, mismas credenciales
     que el catálogo de Entrenadores en admin) ═══════════════════ -->
<div class="screen-full active" id="screen-login">
  <div class="login-wrap">
    <div class="login-marca">CONTENDER<br>CLUB</div>
    <div class="login-rol">&#128170; Entrenador</div>
    <div style="width:100%;max-width:280px;margin-top:8px">
      <div style="margin-bottom:14px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:500">Teléfono</label>
        <input type="tel" id="login-tel" placeholder="5512345678" inputmode="numeric"
          style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none">
      </div>
      <div style="margin-bottom:18px">
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:500">Código</label>
        <input type="text" id="login-code" placeholder="TRAINER01"
          style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none">
      </div>
      <div style="font-size:12px;color:var(--red);min-height:16px;margin-bottom:14px;text-align:center" id="login-err"></div>
      <button id="btn-login" style="width:100%;padding:16px;background:var(--lime);border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;color:#080808;cursor:pointer">Entrar</button>
    </div>
  </div>
</div>

<!-- ═══ INICIO: CHECK-INS ════════════════════════════════════ -->
<div class="screen" id="screen-inicio">
  <div class="hdr">
    <div><h1>Inicio</h1><small id="hdr-fecha"></small></div>
    <div class="hdr-r"><button class="btn bd bsm" id="btn-sync-inicio">↻</button><button class="btn bl bsm" id="btn-checkin">&#10003; Check-in</button></div>
  </div>
  <div style="padding:0 16px;margin-bottom:12px">
    <div class="sbox" style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px">
      <div class="snum" id="st-ci" style="color:var(--lime)">0</div>
      <div class="slbl" style="text-align:left">Check-ins<br>hoy</div>
    </div>
  </div>
  <div style="padding:0 16px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Check-ins de hoy</div>
  <div style="padding:0 16px" id="lista-ci"></div>
  <div class="nav-ph"></div>
</div>

<!-- ═══ SOCIOS ════════════════════════════════════════════════ -->

<div class="screen" id="screen-socios">
  <div class="hdr">
    <div><h1>Socios</h1></div>
    <div class="hdr-r"><button class="btn bd bsm" id="btn-sync-socios">↻</button><button class="btn bl bsm" id="btn-nuevo-soc">+ Agregar</button></div>
  </div>
  <div style="padding:0 16px;margin-bottom:8px">
    <input style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;width:100%;outline:none;" type="text" id="soc-buscar" placeholder="&#128269; Buscar nombre, código, plan…">
  </div>
  <div class="sort-wrap">
    <span class="sort-lbl">Ordenar:</span>
    <select id="sort-sel" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;">
      <option value="id">Por código</option>
      <option value="nombre">Por nombre</option>
      <option value="vencimiento">Por vencimiento</option>
      <option value="plan">Por plan</option>
      <option value="visitas">Por visitas</option>
    </select>
    <button id="btn-orden-dir" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--lime);font-size:16px;cursor:pointer;flex-shrink:0">↑</button>
  </div>
  <div style="padding:0 16px" id="lista-socios"></div>
  <div class="nav-ph"></div>
</div>

<!-- ═══ DETALLE SOCIO ═════════════════════════════════════════ -->

<div class="screen" id="screen-detalle">
  <div class="hdr">
    <div><h1 id="det-nombre">—</h1><small id="det-sub"></small></div>
    <div class="hdr-r"><button class="btn bd bsm" id="btn-sync-det">↻</button><button class="btn bd bsm" id="btn-det-back">← Volver</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-det="membresia">Membresía y Deudas</button>
    <button class="tab" data-det="info">Información</button>
  </div>
  <div id="det-content"></div>
  <div class="nav-ph"></div>
</div>

<!-- ═══ FORMULARIO SOCIO ══════════════════════════════════════ -->

<div class="screen" id="screen-form">
  <div class="hdr">
    <div><h1 id="form-titulo">Nuevo Socio</h1></div>
    <div class="hdr-r"><button class="btn bd bsm" id="btn-form-cancel">Cancelar</button></div>
  </div>
  <div class="sec" style="padding-bottom:20px">
    <div class="f2">
      <div class="fr"><label>Núm. Socio</label><input type="text" id="f-id" placeholder="007" inputmode="numeric"></div>
      <div class="fr"><label>Nombre</label><input type="text" id="f-nombre" placeholder="Nombre"></div>
    </div>
    <div class="f2">
      <div class="fr"><label>Ap. Paterno</label><input type="text" id="f-ap" placeholder="Ap. P."></div>
      <div class="fr"><label>Ap. Materno</label><input type="text" id="f-am" placeholder="Ap. M."></div>
    </div>
    <div class="f2">
      <div class="fr"><label>Teléfono</label><input type="tel" id="f-tel" placeholder="55 1234 5678" inputmode="numeric"></div>
      <div class="fr"><label>Emergencia</label><input type="tel" id="f-emerg" placeholder="55 0000 0000" inputmode="numeric"></div>
    </div>
    <div class="fr"><label>Correo</label><input type="email" id="f-correo" placeholder="correo@mail.com"></div>
    <div class="fr"><label>Fecha de alta</label><input type="date" id="f-inicio"></div>
    <div class="f2">
      <div class="fr"><label>Nacimiento</label><input type="date" id="f-nac"></div>
      <div class="fr"><label>Sexo</label>
        <select id="f-sexo">
          <option value="">—</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
          <option value="O">Otro</option>
        </select>
      </div>
    </div>
    <div class="fr"><label>Notas</label><textarea id="f-notas" placeholder="Lesiones, observaciones…"></textarea></div>
    <button class="btn bl bfull" id="btn-guardar-soc">Guardar</button>
  </div>
  <div class="nav-ph"></div>
</div>

<!-- ═══ CATÁLOGO ══════════════════════════════════════════════ -->

<!-- ═══ REPORTES: SOLO VENTAS PROPIAS ════════════════════════ -->
<div class="screen" id="screen-reportes">
  <div class="hdr"><div><h1>Mis Ventas</h1></div><div class="hdr-r"><button class="btn bd bsm" id="btn-sync-rep">↻</button></div></div>
  <div class="periodo-wrap">
    <label>De</label>
    <input type="date" id="r-desde" style="flex:1">
    <label style="margin-left:4px">—</label>
    <input type="date" id="r-hasta" style="flex:1">
  </div>
  <div id="rep-metricas" style="padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px"></div>
  <div id="rep-lista"></div>
  <div class="nav-ph"></div>
</div>

<!-- ═══ NAV BAR ══════════════════════════════════════════════ -->
<nav class="nav-bar" id="nav-admin" style="display:none">
  <button class="nav-item active" data-screen="inicio"><span class="nav-icon">&#10003;</span>Inicio</button>
  <button class="nav-item" data-screen="socios"><span class="nav-icon">&#128101;</span>Socios</button>
  <button class="nav-item" data-screen="reportes"><span class="nav-icon">&#128176;</span>Mis Ventas</button>
</nav>

<!-- MODAL: CHECK-IN -->
<div class="modal-ov" id="modal-checkin">
  <div class="modal">
    <div class="mhandle"></div>
    <h2>Check-in</h2>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <button class="btn bsm" id="ci-tab-cod" style="flex:1;justify-content:center;background:var(--lime);color:#080808">&#35; Código</button>
      <button class="btn bd bsm" id="ci-tab-scan" style="flex:1;justify-content:center">&#128247; Escáner</button>
    </div>
    <div id="ci-panel-cod">
      <div class="fr"><label>Número de socio o código QR</label>
        <input type="text" id="ci-input" placeholder="001 o GM-001-XXXXXX" autocomplete="off">
      </div>
      <div style="font-size:12px;color:var(--red);min-height:16px;margin-bottom:8px" id="ci-err"></div>
      <button class="btn bl bfull" id="ci-confirmar">Registrar Check-in</button>
    </div>
    <div id="ci-panel-scan" style="display:none">
      <div style="position:relative;width:100%;aspect-ratio:1;background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px">
        <video id="ci-video" style="width:100%;height:100%;object-fit:cover" playsinline muted></video>
        <div style="position:absolute;inset:0;border:3px solid var(--lime);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45);opacity:.85;pointer-events:none;margin:15%"></div>

<!-- ═══ DATA (GymDB / Supabase) ═══════════════════════════════ -->
<script>
// ═══ CONFIGURACIÓN CENTRAL ════════════════════════════════════
var CONFIG = {
  TOAST_MS: 2000,              // duración del toast de aviso
  SCANNER_RETRY_MS: 1500,      // espera tras un QR inválido antes de reintentar
  SCANNER_OK_MS: 700,          // espera tras un QR válido antes de cerrar
  // Defaults de planes — se sobreescriben con el catálogo real de
  // Membresías desde Supabase (ver poblarSelectPlanes).
  PLAN_PRECIO: {Mensual:1200,Trimestral:3200,Semestral:5800,Anual:11000},
  PLAN_DIAS:   {Mensual:30,Trimestral:90,Semestral:180,Anual:365}
};
// Alias cortos usados en toda la lógica
var PLAN_PRECIO = CONFIG.PLAN_PRECIO;
var PLAN_DIAS   = CONFIG.PLAN_DIAS;

// ── Conexión a Supabase ───────────────────────────────────────
var _gymdbReady = GymDB.init(); // Promise — resuelve cuando ya cargó todo

// Variables de trabajo: se llenan con recargarDatos() tras el init
var SOCIOS=[], DEUDAS={}, CHECKINS=[], MEMBRESIAS=[], CLASES=[], PRODUCTOS=[], MENSAJES_CAT=[], VENTAS=[], TRAINERS=[];
var HISTORICO = {ventas:[], checkins:[], socios:[]};
var nextDeuId   = Date.now();
var nextVentaId = Date.now()+1;
var nextCatId   = {memb:Date.now()+2, clase:Date.now()+3, prod:Date.now()+4, msg:Date.now()+5, trainer:Date.now()+6};

// MSGS_WA se construye a partir del catálogo de Mensajes WA
function buildMsgsWA(){
  var obj={};
  MENSAJES_CAT.forEach(function(m,i){ obj[String(i+1)] = m.cuerpo; });
  return obj;
}
var MSGS_WA = {};

function poblarSelectPlanes(){
  if(!MEMBRESIAS || !MEMBRESIAS.length) return;
  MEMBRESIAS.forEach(function(m){
    if(!m.nombre) return;
    PLAN_DIAS[m.nombre]   = m.dias   || 30;
    PLAN_PRECIO[m.nombre] = m.precio || 0;
  });
  var sel=ge("pago-plan"); if(!sel) return;
  var actual=sel.value;
  sel.innerHTML="<option value=''>— Selecciona —</option>";
  MEMBRESIAS.forEach(function(m){
    if(!m.nombre) return;
    var opt=document.createElement("option");
    opt.value=m.nombre;
    opt.textContent=m.nombre+" · "+fm(m.precio||0);
    sel.appendChild(opt);
  });
  if(actual) sel.value=actual;
}

// Registra una venta (producto o membresía) en memoria y en Supabase,
// y deja VENTAS sincronizado. Único punto de creación de ventas.
function crearVenta(campos){
  var v={id:nextVentaId++, cantidad:1, status:"pagado", fecha:hoyISO()};
  Object.keys(campos).forEach(function(k){ v[k]=campos[k]; });
  VENTAS.unshift(v);
  GymDB.saveVentas(VENTAS);
  VENTAS=GymDB.getVentas();
  return v;
}

// Refresca SOCIOS desde el cache y re-apunta socioActual al objeto
// nuevo (después de un setSocio, para no quedarnos con la copia vieja).
function refrescarSocioActual(id){
  SOCIOS = GymDB.getSocios();
  if(id) socioActual = SOCIOS.find(function(x){return x.id===id;}) || socioActual;
}

// Sincronización manual: recarga todo desde Supabase y re-renderiza.
// Un solo comportamiento para todos los botones ↻ de la app.
function sincronizar(btn, renderFn){
  btn.textContent="…"; btn.disabled=true;
  GymDB.init().then(function(){
    recargarDatos();
    if(socioActual) refrescarSocioActual(socioActual.id);
    renderFn();
    btn.textContent="↻"; btn.disabled=false;
    mostrarToast("↻ Actualizado");
  }).catch(function(){
    btn.textContent="↻"; btn.disabled=false;
    mostrarToast("⚠ No se pudo actualizar");
  });
}

// Fecha de hoy en formato ISO (YYYY-MM-DD) — usada en toda la app
// Fecha de hoy en formato ISO (YYYY-MM-DD) — usada en toda la app.
// BUG CORREGIDO: toISOString() da la fecha en UTC, no en hora local.
// Para México (UTC-6) eso hacía que desde las 6:00 PM hora local el
// sistema ya pensara que era el día siguiente.
function hoyISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// Trae del cache de GymDB (ya cargado por init) a las variables locales
// que usa toda la lógica de renderizado de este archivo.
function recargarDatos(){
  SOCIOS       = GymDB.getSocios();
  DEUDAS       = GymDB.getAllDeudas();
  CHECKINS     = GymDB.getTodayCheckins();
  MEMBRESIAS   = GymDB.getMembresias();
  poblarSelectPlanes();
  CLASES       = GymDB.getClases();
  PRODUCTOS    = GymDB.getProductos();
  MENSAJES_CAT = GymDB.getMensajes();
  MSGS_WA      = buildMsgsWA();
  VENTAS       = GymDB.getVentas();
  TRAINERS     = GymDB.getTrainers();
  HISTORICO    = GymDB.getHistorico();
}


function mostrarToast(msg){
  var t=ge("toast-sync");
  if(!t){
    t=document.createElement("div");
    t.id="toast-sync";
    t.style.cssText="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#C8F135;border:1px solid rgba(200,241,53,.4);border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;z-index:9999;transition:opacity .3s;pointer-events:none";
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){ t.style.opacity="0"; },CONFIG.TOAST_MS);
}
</script>

<!-- ═══ LÓGICA ════════════════════════════════════════════════ -->
<script>
function ge(id){return document.getElementById(id);}
function fm(n){return "$"+Number(n).toLocaleString("es-MX");}
function ini(s){return (s.nombre[0]+s.apellido_paterno[0]).toUpperCase();}
function fF(f){return f?new Date(f+"T00:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"2-digit"}):"—";}
// Suma/resta días a una fecha YYYY-MM-DD, aritmética pura sin pasar
// por UTC (evita que se corra un día según la zona horaria).
function addDays(f,d){
  var p=f.split("-");
  var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  dt.setUTCDate(dt.getUTCDate()+d);
  return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
}
function addWeeks(f,w){return addDays(f,w*7);}
function nCompleto(s){return [s.nombre,s.apellido_paterno,s.apellido_materno].filter(Boolean).join(" ");}

// Total abonado en el ciclo de membresía vigente del socio.
function totalAbonado(s){
  return (s.abonos||[]).filter(function(a){return a.pagado!==false;}).reduce(function(a,x){return a+(x.monto||0);},0);
}
function saldoMembresia(s){
  var precio=PLAN_PRECIO[s.plan]||0;
  return Math.max(precio-totalAbonado(s),0);
}
function calcStatus(s){
  if(!s.activo)return"inactivo";
  // Sin membresía asignada (ej. después de eliminarla) — antes esto
  // caía en "aldia" por accidente porque new Date("") es una fecha
  // inválida y las comparaciones daban NaN, que nunca es <0 ni ===0.
  if(!s.plan||!s.fecha_vencimiento)return"sinmemb";
  // Mientras deba algo de la membresía vigente, el estatus es
  // "pendiente" sin importar la fecha de vencimiento.
  if(saldoMembresia(s)>0)return"pendiente";
  var h=new Date();h.setHours(0,0,0,0);
  var v=new Date(s.fecha_vencimiento);v.setHours(0,0,0,0);
  var d=Math.ceil((v-h)/86400000);
  if(d<0)return"vencido";if(d===0)return"vencehoy";return"aldia";
}
function avColor(st){return st==="aldia"?"#C8F135":st==="vencehoy"||st==="pendiente"?"var(--orange)":st==="sinmemb"?"var(--muted)":"var(--red)";}
function pillSt(st){
  var m={aldia:"pg",vencehoy:"po",vencido:"pr",inactivo:"pm",sinmemb:"pm",pendiente:"po"};
  var l={aldia:"Al día",vencehoy:"Vence hoy",vencido:"Vencido",inactivo:"Inactivo",sinmemb:"Sin membresía",pendiente:"Pendiente"};
  return "<span class='pill "+(m[st]||"pm")+"'>"+(l[st]||st)+"</span>";
}


// ── ESTADO ────────────────────────────────────────────────────
var sortActual  = "id";
var ordenAsc    = true;
var socioActual = null;
var detTab      = "membresia";
var waTarget    = null;
var repTab      = "ventas";

// El entrenador con sesión iniciada (se llena al hacer login contra el
// catálogo de Entrenadores). Todas las ventas/deudas/pagos que este
// entrenador registre se le asignan automáticamente — no hay selector
// de entrenador en ningún modal de esta app, a diferencia de admin.
var TRAINER_ACTUAL = null;

// ── NAVEGACIÓN ────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll(".screen,.screen-full").forEach(function(s){s.classList.remove("active");});
  ge("screen-"+id).classList.add("active");

    b.classList.toggle("active",b.dataset.screen===id);
  });
  if(id==="inicio")   renderInicio();
  if(id==="socios")   renderSocios();
  if(id==="reportes") renderReporte();
  if(id==="detalle")  setTimeout(renderDetalle,0);
}

// ── LOGIN ENTRENADOR ────────────────────────────────────────────
// Valida teléfono+código contra el catálogo de Entrenadores (mismo
// que administra Oliver desde admin.html → Catálogo → Entrenadores).
// No hay PIN aquí — cada entrenador tiene sus propias credenciales.
function intentarLoginEntrenador(){
  var tel  = ge("login-tel").value.replace(/\D/g,"").trim();
  var code = ge("login-code").value.trim();
  if(!tel||!code){ ge("login-err").textContent="Ingresa teléfono y código"; return; }
  var t = TRAINERS.find(function(x){ return x.telefono===tel && x.codigo===code; });
  if(!t){ ge("login-err").textContent="Teléfono o código incorrecto"; return; }
  TRAINER_ACTUAL = t;
  ge("login-err").textContent="";
  ge("screen-login").classList.remove("active");
  ge("nav-admin").style.display="flex";
  var str=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  ge("hdr-fecha").textContent=str.charAt(0).toUpperCase()+str.slice(1);
  showScreen("inicio");
}

// ── INICIO ────────────────────────────────────────────────────
function renderInicio(){
  // CHECKINS ahora guarda el historial completo (con fecha) para Reportes.
  // Aquí en Inicio solo mostramos los de HOY.
  var hoy=hoyISO();
  var deHoy=CHECKINS.filter(function(c){return c.fecha===hoy;});
  ge("st-ci").textContent=deHoy.length;
  var html="";
  if(!deHoy.length) html="<div class='empty'><div class='ico'>&#128170;</div><p>Sin check-ins hoy</p></div>";
  else deHoy.forEach(function(ci){
    var s=SOCIOS.find(function(x){return x.id===ci.socio_id;}); if(!s) return;
    var st=calcStatus(s);
    var deudas=DEUDAS[s.id]||[];
    var totalD=deudas.reduce(function(a,d){return a+d.total;},0);
    var abonoV=(s.abonos||[]).find(function(a){
      var lim=new Date(a.fecha_limite+"T00:00:00"),h=new Date();h.setHours(0,0,0,0);
      return !a.pagado&&lim<h;
    });
    html+="<div class='ci-row' data-ver='"+s.id+"'>";
    html+="<div class='ci-av'>"+ini(s)+"</div>";
    html+="<div style='flex:1;min-width:0'><div style='font-size:13px;font-weight:700'>#"+s.id+" · "+s.nombre+" "+s.apellido_paterno+"</div>";
    html+="<div style='font-size:10px;color:var(--muted);margin-top:2px'>"+ci.hora+" · "+(s.plan||"Sin membresía")+"</div>";
    html+="<div style='margin-top:4px;display:flex;gap:5px;flex-wrap:wrap'>"+pillSt(st);
    if(totalD>0) html+="<span class='pill po'>Debe: "+fm(totalD)+"</span>";
    if(abonoV)   html+="<span class='pill pr'>Abono vencido</span>";
    html+="</div></div><span style='color:var(--muted);font-size:18px'>›</span></div>";
  });
  ge("lista-ci").innerHTML=html;
  ge("lista-ci").querySelectorAll("[data-ver]").forEach(function(el){
    el.addEventListener("click",function(){
      socioActual=SOCIOS.find(function(s){return s.id===this.dataset.ver;},this);
      detTab="membresia";
      showScreen("detalle");
    });
  });
}

// ── CHECK-IN ──────────────────────────────────────────────────
function buscarSocioCI(val){
  val=val.trim();
  var m=val.match(/^GM-(\d+)-/i);
  return SOCIOS.find(function(s){return s.id===(m?m[1]:val);});
}
function abrirCheckin(){
  ge("ci-input").value=""; ge("ci-err").textContent="";
  ge("ci-panel-cod").style.display="block"; ge("ci-panel-scan").style.display="none";
  ge("ci-tab-cod").style.background="var(--lime)"; ge("ci-tab-cod").style.color="#080808";
  ge("ci-tab-scan").className="btn bd bsm"; ge("ci-tab-scan").style="";
  ge("modal-checkin").classList.add("open");
  setTimeout(function(){ge("ci-input").focus();},300);
}
// NOTA: CHECKINS ahora viene de GymDB.getTodayCheckins() (cache de
// Supabase, tabla checkins). GymDB.addCheckin ya valida duplicados,
// incrementa visitas del socio, y guarda en Supabase.
function registrarCheckinPorCodigo(codigo){
  var s=buscarSocioCI(codigo);
  if(!s){return {ok:false,msg:"Socio no encontrado"};}
  var agregado = GymDB.addCheckin(s.id);
  if(!agregado){return {ok:false,msg:s.nombre+" ya tiene check-in hoy"};}
  CHECKINS = GymDB.getTodayCheckins();
  SOCIOS   = GymDB.getSocios();
  return {ok:true,socio:s};
}
function confirmarCI(){
  var r=registrarCheckinPorCodigo(ge("ci-input").value);
  if(!r.ok){ge("ci-err").textContent=r.msg;return;}
  ge("modal-checkin").classList.remove("open");
  renderInicio();
}

// ── ESCÁNER QR (cámara real con jsQR) ─────────────────────────
var scanStream=null, scanRAF=null, scanBusy=false;

function iniciarScanner(){
  ge("ci-scan-err").textContent="";
  ge("ci-scan-status").textContent="Iniciando cámara…";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    ge("ci-scan-err").textContent="Este navegador no soporta cámara";
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
    .then(function(stream){
      scanStream=stream;
      var video=ge("ci-video");
      video.srcObject=stream;
      video.play();
      ge("ci-scan-status").textContent="Apunta la cámara al código QR del socio";
      scanBusy=false;
      tickScanner();
    })
    .catch(function(err){
      ge("ci-scan-status").textContent="";
      if(err.name==="NotAllowedError") ge("ci-scan-err").textContent="Permiso de cámara denegado";
      else ge("ci-scan-err").textContent="No se pudo acceder a la cámara";
    });
}
function detenerScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF=null;
  if(scanStream){
    scanStream.getTracks().forEach(function(t){t.stop();});
    scanStream=null;
  }
}
function tickScanner(){
  var video=ge("ci-video"),canvas=ge("ci-canvas");
  if(!scanStream){return;}
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    var ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    var img=ctx.getImageData(0,0,canvas.width,canvas.height);
    var code=window.jsQR&&jsQR(img.data,img.width,img.height);
    if(code&&code.data&&!scanBusy){
      scanBusy=true;
      procesarCodigoEscaneado(code.data);
      return; // detiene el loop; se reinicia si el usuario vuelve a la pestaña
    }
  }
  scanRAF=requestAnimationFrame(tickScanner);
}
function procesarCodigoEscaneado(data){
  var r=registrarCheckinPorCodigo(data);
  if(!r.ok){
    ge("ci-scan-err").textContent=r.msg;
    ge("ci-scan-status").textContent="Intenta con otro código";
    setTimeout(function(){ scanBusy=false; if(scanStream) tickScanner(); }, CONFIG.SCANNER_RETRY_MS);
    return;
  }
  ge("ci-scan-status").textContent="✓ Check-in registrado: "+r.socio.nombre;
  ge("ci-scan-err").textContent="";
  setTimeout(function(){
    detenerScanner();
    ge("modal-checkin").classList.remove("open");
    renderInicio();
  }, CONFIG.SCANNER_OK_MS);
}


// ── SOCIOS ────────────────────────────────────────────────────
function renderSocios(){
  var q=ge("soc-buscar").value.toLowerCase().trim();
  var list=SOCIOS.slice();
  if(q) list=list.filter(function(s){return nCompleto(s).toLowerCase().indexOf(q)>-1||s.id.indexOf(q)>-1||(s.plan||"").toLowerCase().indexOf(q)>-1;});
  list.sort(function(a,b){
    var r=0;
    if(sortActual==="nombre")     r=nCompleto(a).localeCompare(nCompleto(b));
    else if(sortActual==="vencimiento") r=new Date(a.fecha_vencimiento)-new Date(b.fecha_vencimiento);
    else if(sortActual==="plan")  r=(a.plan||"").localeCompare(b.plan||"");
    else if(sortActual==="visitas") r=(b.visitas||0)-(a.visitas||0);
    else r=a.id.localeCompare(b.id);
    return ordenAsc?r:-r;
  });
  var c=ge("lista-socios");
  if(!list.length){c.innerHTML="<div class='empty'><div class='ico'>&#128101;</div><p>Sin resultados</p></div>";return;}
  var html="";

// ── DETALLE SOCIO ─────────────────────────────────────────────
function renderDetalle(){
  if(!socioActual){showScreen("socios");return;}
  var s=socioActual;
  ge("det-nombre").textContent=s.nombre+" "+s.apellido_paterno;
  ge("det-sub").textContent="#"+s.id+" · "+(s.plan||"Sin membresía");
  if(detTab==="membresia") renderTabMembresia(s);
  else renderTabInfo(s);
}

function renderTabMembresia(s){
  var st=calcStatus(s),todasDeudas=DEUDAS[s.id]||[];
  // Las deudas antiguas sin "tipo" se asumen de producto (compatibilidad).
  var deudas=todasDeudas.filter(function(d){return d.tipo!=="membresia";});
  var totalD=deudas.reduce(function(a,d){return a+d.total;},0);
  var html="<div class='sec' style='padding-bottom:20px'>";

  // Resumen de saldo de la membresía vigente (precio del plan - lo
  // abonado hasta hoy), sin importar cuántos pagos ni de qué monto.
  if(st!=="sinmemb"){
    var precio=PLAN_PRECIO[s.plan]||0, abonado=totalAbonado(s), saldo=Math.max(precio-abonado,0);
    html+="<div class='card "+(saldo>0?"naranja":"verde")+"' style='margin-bottom:14px'>";
    html+="<div style='display:flex;justify-content:space-between;align-items:center'>";
    html+="<div><div style='font-family:\"Bebas Neue\",sans-serif;font-size:20px'>"+s.plan+"</div><div style='font-size:12px;color:var(--muted)'>Vence: "+fF(s.fecha_vencimiento)+"</div></div>"+pillSt(st)+"</div>";
    html+="<div style='display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px'><span>Pagado: "+fm(abonado)+" / "+fm(precio)+"</span>"+(saldo>0?"<span style='color:var(--orange);font-weight:700'>Saldo: "+fm(saldo)+"</span>":"")+"</div>";
    html+="</div>";
  }

  // Botones
  html+="<div style='display:flex;gap:8px;margin-bottom:14px'>";
  var txtBtn = st==="sinmemb" ? "+ Asignar membresía" : st==="pendiente" ? "+ Abonar" : "+ Renovar membresía";
  html+="<button class='btn bl bsm' id='btn-renovar' style='flex:1;justify-content:center'>"+txtBtn+"</button>";
  html+="</div>";

  // Historial de pagos: ahora es la ÚNICA vista de membresías — cada
  // fila muestra el plan, ciclo de cobertura y qué entrenador registró
  // ese pago. La más reciente tiene botón de editar además de eliminar.
  html+="<div style='font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px'>Historial de pagos</div>";
  var histMemb=VENTAS.filter(function(v){return v.tipo==="memb"&&v.socio_id===s.id;}).sort(function(a,b){return (b.fecha||"").localeCompare(a.fecha||"");});
  if(!histMemb.length){
    html+="<div style='font-size:13px;color:var(--muted);padding:8px 0 14px'>Sin pagos registrados todavía</div>";
  } else {
    html+="<div class='card' style='margin-bottom:14px'>";
    histMemb.forEach(function(v,i){
      html+="<div class='abono-row'><div style='flex:1;min-width:0'>";
      html+="<div style='font-size:13px;font-weight:600'>"+v.producto+(i===0?" <span style='color:var(--lime);font-size:10px;font-weight:700'>· MÁS RECIENTE</span>":"")+"</div>";
      html+="<div style='font-size:11px;color:var(--muted)'>Ciclo: "+fF(v.membresia_inicio)+" → "+fF(v.membresia_vencimiento)+"</div>";
      html+="<div style='font-size:11px;color:var(--muted)'>"+(v.trainer||"—")+" · pagado "+fF(v.fecha)+"</div>";
      html+="</div>";
      html+="<div style='font-family:\"Bebas Neue\",sans-serif;font-size:16px;color:var(--lime);margin-right:8px'>"+fm(v.total)+"</div>";
      if(i===0) html+="<button class='btn bd bsm' data-edit-hist-memb='"+v.id+"' style='margin-right:4px'>&#9999;</button>";
      html+="<button class='btn br bsm' data-del-hist-memb='"+v.id+"'>&#128465;</button></div>";
    });
    html+="</div>";
  }

  // Deudas
  html+="<div style='font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px'>Deudas de productos</div>";
  if(!deudas.length) html+="<div style='font-size:13px;color:var(--muted);padding:8px 0'>Sin deudas ✓</div>";
  else{
    deudas.forEach(function(d){
      html+="<div class='card naranja' style='display:flex;align-items:center;gap:10px;margin-bottom:6px'>";
      html+="<div style='flex:1'><div style='font-weight:600;font-size:13px'>"+d.producto+"</div><div style='font-size:11px;color:var(--muted)'>"+fF(d.fecha)+(d.trainer?" · "+d.trainer:"")+"</div></div>";
      html+="<div style='font-family:\"Bebas Neue\",sans-serif;font-size:18px;color:var(--orange)'>"+fm(d.total)+"</div>";
      html+="<button class='btn bg2b bsm' data-pag-deuda='"+d.id+"'>&#10003;</button></div>";
    });
    html+="<div style='text-align:right;font-size:12px;color:var(--orange);margin-top:4px'>Total: "+fm(totalD)+"</div>";
  }
  html+="<div style='margin-top:12px'><button class='btn bd bsm' id='btn-add-prod' style='width:100%;justify-content:center'>+ Agregar producto</button></div>";
  html+="</div>";
  ge("det-content").innerHTML=html;

  ge("btn-renovar").addEventListener("click",function(){abrirModalPago(s);});
  ge("btn-add-prod").addEventListener("click",function(){abrirModalProdSoc(s);});
  ge("det-content").querySelectorAll("[data-edit-hist-memb]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var v=VENTAS.find(function(x){return String(x.id)===this.dataset.editHistMemb;},this);
      if(v) abrirModalPago(s, v);
    });
  });
  ge("det-content").querySelectorAll("[data-del-hist-memb]").forEach(function(btn){
    btn.addEventListener("click",function(){
      if(!confirm("¿Eliminar este registro del historial de membresías? No se puede deshacer."))return;
      GymDB.removeVenta(this.dataset.delHistMemb);
      VENTAS = GymDB.getVentas();
      renderDetalle();
    });
  });
  ge("det-content").querySelectorAll("[data-pag-deuda]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var did=this.dataset.pagDeuda;
      if(!confirm("¿Marcar como pagado?")) return;
      GymDB.removeDeuda(s.id, did);
      DEUDAS = GymDB.getAllDeudas();
      renderDetalle();
    });
  });
}

// ── FORMULARIO SOCIO ──────────────────────────────────────────
var socEditId=null;
function abrirNuevoSoc(){
  socEditId=null; ge("form-titulo").textContent="Nuevo Socio";
  ["f-id","f-nombre","f-ap","f-am","f-tel","f-emerg","f-correo","f-notas"].forEach(function(i){ge(i).value="";});
  ge("f-id").disabled=false;
  ge("f-inicio").value=hoyISO();
  ge("f-nac").value="";ge("f-sexo").value="";
  showScreen("form");
}
function abrirEditarSoc(id){
  var s=SOCIOS.find(function(x){return x.id===id;}); if(!s) return;
  socEditId=id; ge("form-titulo").textContent="Editar Socio";
  ge("f-id").value=s.id;ge("f-nombre").value=s.nombre;ge("f-ap").value=s.apellido_paterno;ge("f-am").value=s.apellido_materno||"";
  // El número de socio es la llave de todo (cuenta de acceso, deudas,
  // ventas, check-ins) — no se puede cambiar una vez creado, porque
  // "cambiarlo" en realidad crearía un socio duplicado.
  ge("f-id").disabled=true;
  ge("f-tel").value=s.numero||"";ge("f-emerg").value=s.numero_emergencia||"";ge("f-correo").value=s.correo||"";
  ge("f-notas").value=s.notas||"";ge("f-inicio").value=s.fecha_inicio||"";
  ge("f-nac").value=s.fecha_nacimiento||"";ge("f-sexo").value=s.sexo||"";
  showScreen("form");
}
function guardarSoc(){
  // Al editar, el id manda desde socEditId (el campo está deshabilitado)
  var id=(socEditId||ge("f-id").value).trim(),nombre=ge("f-nombre").value.trim(),ap=ge("f-ap").value.trim();
  if(!id||!nombre||!ap){alert("Número, nombre y apellido son requeridos");return;}
  var existente=SOCIOS.find(function(x){return x.id===id;});
  // Desde "Nuevo Socio", un número ya ocupado no debe sobrescribir al
  // socio existente en silencio — se rechaza con aviso claro.
  if(!socEditId && existente){alert("Ya existe un socio con el número "+id);return;}
  var esNuevo=!existente;
  // El plan/vencimiento NO se captura aquí — primero se generan los
  // datos del socio, y la membresía se asigna después desde su detalle
  // ("+ Asignar membresía"). Si ya existía, se conserva su membresía tal
  // cual estaba; si es nuevo, queda "sin membresía" hasta asignarle una.
  var datos={id:id,nombre:nombre,apellido_paterno:ap,apellido_materno:ge("f-am").value.trim(),
    numero:ge("f-tel").value.replace(/\D/g,"").trim(),numero_emergencia:ge("f-emerg").value.trim(),correo:ge("f-correo").value.trim(),
    notas:ge("f-notas").value.trim(),fecha_inicio:ge("f-inicio").value,
    fecha_vencimiento:existente?existente.fecha_vencimiento:"",
    fecha_nacimiento:ge("f-nac").value,plan:existente?existente.plan:"",sexo:ge("f-sexo").value,
    visitas:existente?existente.visitas:0, activo:existente?existente.activo:true,
    abonos:existente?(existente.abonos||[]):[]};
  // GymDB.setSocio hace insert o update según si el id ya existe, y
  // también crea/actualiza la cuenta de acceso (tel+código) del socio.
  GymDB.setSocio(datos);
  SOCIOS = GymDB.getSocios();
  socioActual = SOCIOS.find(function(x){return x.id===id;});
  if(esNuevo){
    // Socio recién creado → directo a su detalle para asignarle membresía
    detTab="membresia";
    showScreen("detalle");
  } else {
    showScreen("socios");
  }
}

// ── MODAL PAGO ────────────────────────────────────────────────
var ventaEditando = null; // venta que se está editando (null = alta/abono normal)
var pagoModo = "nuevo";   // "nuevo" (asignar/renovar) | "abonar" (a ciclo vigente) | "editar"

function abrirModalPago(s, ventaEditar){
  ventaEditando = ventaEditar || null;
  var st = calcStatus(s);
  var camposNuevo = ge("pago-campos-nuevo");

  if(ventaEditando){
    pagoModo="editar";
    ge("pago-titulo").textContent = "Editar Pago";
    ge("pago-monto-lbl").textContent = "Monto";
    camposNuevo.style.display="block";
    ge("pago-plan").value = ventaEditando.producto || s.plan || "Mensual";
    ge("pago-inicio").value = ventaEditando.membresia_inicio || s.fecha_inicio || hoyISO();
    ge("pago-monto").value = ventaEditando.total||0;
  } else if(st==="pendiente"){
    pagoModo="abonar";
    ge("pago-titulo").textContent = "Abonar a Membresía";
    ge("pago-monto-lbl").textContent = "Monto a abonar";
    camposNuevo.style.display="none";
    ge("pago-monto").value = saldoMembresia(s);
  } else {
    pagoModo="nuevo";
    ge("pago-titulo").textContent = st==="sinmemb" ? "Asignar Membresía" : "Renovar Membresía";
    ge("pago-monto-lbl").textContent = "Monto a abonar";
    camposNuevo.style.display="block";
    ge("pago-plan").value=s.plan||"Mensual";
    var hoy=hoyISO();
    var inicioSugerido = (s.fecha_vencimiento && s.fecha_vencimiento>hoy) ? s.fecha_vencimiento : hoy;
    ge("pago-inicio").value=inicioSugerido;
    ge("pago-monto").value = PLAN_PRECIO[ge("pago-plan").value]||0;
  }
  actualizarResumenPago();
  ge("modal-pago").classList.add("open");
}
function actualizarResumenPago(){
  var s=socioActual; if(!s) return;
  var monto=+ge("pago-monto").value||0;
  // El entrenador que registra el pago siempre es el que tiene la
  // sesión iniciada — no hay selector porque no aplica.
  var html="<strong>Entrenador:</strong> "+(TRAINER_ACTUAL?TRAINER_ACTUAL.nombre:"—")+"<br>";
  if(pagoModo==="abonar"){
    var precio=PLAN_PRECIO[s.plan]||0, yaAbonado=totalAbonado(s);
    var saldoAntes=Math.max(precio-yaAbonado,0);
    var saldoDespues=Math.max(saldoAntes-monto,0);
    html+="<strong>Plan:</strong> "+s.plan+" · "+fm(precio)+"<br>";
    html+="<strong>Ya pagado:</strong> "+fm(yaAbonado)+" · <strong>Saldo:</strong> "+fm(saldoAntes)+"<br>";
    html+="<strong>Después de este abono:</strong> "+fm(saldoDespues)+(saldoDespues===0?" · <span style='color:var(--lime)'>Queda AL DÍA ✓</span>":"");
  } else {
    var plan=ge("pago-plan").value,fi=ge("pago-inicio").value;
    var precio2=PLAN_PRECIO[plan]||0,dias=PLAN_DIAS[plan]||30;
    var fv=fi?addDays(fi,dias):"—";
    var saldo2=Math.max(precio2-monto,0);
    html+="<strong>Plan:</strong> "+plan+" · "+fm(precio2)+"<br><strong>Vence:</strong> "+fF(fv)+"<br>";
    html+="<strong>Abona hoy:</strong> "+fm(monto)+"<br>";
    html+= saldo2>0 ? "<strong>Queda pendiente:</strong> "+fm(saldo2) : "<span style='color:var(--lime)'>Queda AL DÍA ✓</span>";
  }
  ge("pago-resumen").innerHTML=html;
}
function guardarPago(){
  var s=socioActual, trainer=TRAINER_ACTUAL.nombre, monto=+ge("pago-monto").value||0;
  if(!s) return;
  if(monto<=0){alert("Ingresa un monto válido");return;}
  var hoyPago=hoyISO();

  if(pagoModo==="editar"){
    var plan=ge("pago-plan").value, fi=ge("pago-inicio").value;
    if(!plan){alert("Selecciona un plan");return;}
    var fechaVenc=addDays(fi,PLAN_DIAS[plan]||30);
    GymDB.updateVenta(ventaEditando.id,{producto:plan,total:monto,trainer:trainer,membresia_inicio:fi,membresia_vencimiento:fechaVenc});
    VENTAS=GymDB.getVentas();
    var abonoVinculado=(s.abonos||[]).find(function(a){return a.ventaId===ventaEditando.id;});
    if(abonoVinculado){ abonoVinculado.monto=monto; abonoVinculado.trainer=trainer; }
    var histOrdenado=VENTAS.filter(function(v){return v.tipo==="memb"&&v.socio_id===s.id;}).sort(function(a,b){return (b.fecha||"").localeCompare(a.fecha||"");});
    if(histOrdenado.length && String(histOrdenado[0].id)===String(ventaEditando.id)){
      s.plan=plan; s.fecha_inicio=fi; s.fecha_vencimiento=fechaVenc;
    }
    GymDB.setSocio(s);
    refrescarSocioActual(s.id);
    ventaEditando=null;
    ge("modal-pago").classList.remove("open");
    renderDetalle();
    return;
  }

  if(pagoModo==="abonar"){
    var venta=crearVenta({socio_id:s.id,socio_nombre:s.nombre+" "+s.apellido_paterno,producto:s.plan,total:monto,fecha:hoyPago,tipo:"memb",trainer:trainer,membresia_inicio:s.fecha_inicio,membresia_vencimiento:s.fecha_vencimiento});
    if(!s.abonos) s.abonos=[];
    s.abonos.push({numero:s.abonos.length+1, monto:monto, fecha_pago:hoyPago, trainer:trainer, ventaId:venta.id});
    GymDB.setSocio(s);
    refrescarSocioActual(s.id);
    ge("modal-pago").classList.remove("open");
    renderDetalle();
    return;
  }

  var plan2=ge("pago-plan").value, fi2=ge("pago-inicio").value;
  if(!plan2||!fi2) return;
  var fechaVenc2=addDays(fi2,PLAN_DIAS[plan2]||30);
  s.plan=plan2; s.fecha_inicio=fi2; s.fecha_vencimiento=fechaVenc2;
  var venta2=crearVenta({socio_id:s.id,socio_nombre:s.nombre+" "+s.apellido_paterno,producto:plan2,total:monto,fecha:hoyPago,tipo:"memb",trainer:trainer,membresia_inicio:fi2,membresia_vencimiento:fechaVenc2});
  s.abonos=[{numero:1, monto:monto, fecha_pago:hoyPago, trainer:trainer, ventaId:venta2.id}];
  GymDB.clearAbonos(s.id).then(function(){
    GymDB.setSocio(s);
    refrescarSocioActual(s.id);
  });
  ge("modal-pago").classList.remove("open");
  renderDetalle();
}

// ── MODAL PRODUCTO A SOCIO ────────────────────────────────────
function abrirModalProdSoc(s){
  var sel=ge("ps-producto"); sel.innerHTML="<option value=''>— Selecciona —</option>";
  PRODUCTOS.forEach(function(p){
    sel.innerHTML+="<option value='"+p.id+"'>"+p.nombre+" · "+fm(p.costo)+" · Stock: "+p.stock+"</option>";
  });
  ge("ps-cantidad").value=1; ge("ps-status").value="pagado"; ge("ps-total").textContent="$0";
  ge("modal-prod-soc").classList.add("open");
}
function calcPSTot(){
  var p=PRODUCTOS.find(function(x){return x.id===+ge("ps-producto").value;});
  ge("ps-total").textContent=p?fm(p.costo*(+ge("ps-cantidad").value||1)):"$0";
}
function guardarProdSoc(){
  var s=socioActual; if(!s) return;
  var p=PRODUCTOS.find(function(x){return x.id===+ge("ps-producto").value;});
  if(!p){alert("Selecciona un producto");return;}
  var cant=+ge("ps-cantidad").value||1;
  if(cant>p.stock){alert("Stock insuficiente. Disponible: "+p.stock);return;}
  var trainer=TRAINER_ACTUAL.nombre;
  var fecha=hoyISO();
  if(ge("ps-status").value==="debe"){
    GymDB.addDeuda(s.id, {id:"d"+(nextDeuId++), producto:p.nombre, total:p.costo*cant, fecha:fecha, trainer:trainer, tipo:"producto"});
    DEUDAS = GymDB.getAllDeudas();
  }
  crearVenta({socio_id:s.id,socio_nombre:s.nombre+" "+s.apellido_paterno,producto:p.nombre,cantidad:cant,total:p.costo*cant,fecha:fecha,status:ge("ps-status").value,tipo:"prod",trainer:trainer});
  p.stock = p.stock - cant;
  GymDB.saveProductos(PRODUCTOS);
  PRODUCTOS = GymDB.getProductos();
  ge("modal-prod-soc").classList.remove("open");
  renderDetalle();
}

// ── WA ────────────────────────────────────────────────────────
function abrirWA(id){
  waTarget=SOCIOS.find(function(s){return s.id===id;}); if(!waTarget) return;
  ge("wa-para").textContent="Para: "+nCompleto(waTarget)+" · "+waTarget.numero;
  ge("wa-tipo").value=""; ge("wa-preview").textContent="Selecciona un tipo…";
  ge("modal-wa").classList.add("open");
}
function previewWA(){
  var t=MSGS_WA[ge("wa-tipo").value];
  ge("wa-preview").textContent=t&&waTarget?t.replace(/\{nombre\}/g,waTarget.nombre).replace(/\{plan\}/g,waTarget.plan):"Selecciona un tipo…";
}
function enviarWA(){
  var t=MSGS_WA[ge("wa-tipo").value]; if(!t||!waTarget){alert("Selecciona un tipo");return;}
  var msg=t.replace(/\{nombre\}/g,waTarget.nombre).replace(/\{plan\}/g,waTarget.plan);
  window.open("https://wa.me/52"+waTarget.numero.replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank");
  ge("modal-wa").classList.remove("open");
}

// ── REPORTES: solo Ventas del entrenador con sesión iniciada ────
// A diferencia de admin, aquí NO hay selector de entrenador — el
// filtro es automático y forzado al que tiene la sesión abierta. Un
// entrenador nunca ve las ventas de los demás.
function mbox(v,c,l){return "<div style='background:var(--bg2);border-radius:12px;padding:12px 10px;text-align:center;border:1px solid var(--border)'><div style='font-family:\"Bebas Neue\",sans-serif;font-size:26px;color:"+c+"'>"+v+"</div><div style='font-size:10px;color:var(--muted);margin-top:3px'>"+l+"</div></div>";}
function rfila(av,avColor,n,sub,val){return "<div style='display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border)'><div style='width:32px;height:32px;border-radius:50%;background:"+avColor+";display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#080808;flex-shrink:0'>"+av+"</div><div style='flex:1;min-width:0'><div style='font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+n+"</div><div style='font-size:11px;color:var(--muted);margin-top:2px'>"+sub+"</div></div><div style='font-family:\"Bebas Neue\",sans-serif;font-size:18px;flex-shrink:0;text-align:right'>"+val+"</div></div>";}

function enPeriodo(fecha){
  var desde=ge("r-desde").value,hasta=ge("r-hasta").value;
  if(desde&&fecha<desde)return false;
  if(hasta&&fecha>hasta)return false;
  return true;
}

function renderReporte(){
  if(!TRAINER_ACTUAL) return;
  var propias = VENTAS.filter(function(v){
    return v.trainer===TRAINER_ACTUAL.nombre && enPeriodo(v.fecha);
  });
  var totProd = propias.filter(function(v){return v.tipo==="prod";}).reduce(function(a,v){return a+v.total;},0);
  var totMemb = propias.filter(function(v){return v.tipo==="memb";}).reduce(function(a,v){return a+v.total;},0);
  ge("rep-metricas").innerHTML = mbox(fm(totProd),"var(--lime)","Productos") + mbox(fm(totMemb),"var(--green)","Membresías");

  var html="";
  propias.sort(function(a,b){return b.id-a.id;}).forEach(function(v){
    var etiqueta = v.tipo==="memb" ? "Membresía" : "Producto";
    html+=rfila("$","var(--lime)",v.producto,etiqueta+" · #"+v.socio_id+" "+v.socio_nombre+" · "+fF(v.fecha),"<span class='pill "+(v.status==="pagado"?"pg":"po")+"'>"+(v.status==="pagado"?"Cobrado":"Por cobrar")+"</span><br>"+fm(v.total));
  });
  ge("rep-lista").innerHTML = html || "<div class='empty'><div class='ico'>&#128176;</div><p>Sin ventas en este periodo</p></div>";
}

// ── EVENTOS ───────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded",function(){
 _gymdbReady.then(function(){
  var ov=ge("ov-loading");
  if(ov) ov.style.display="none";
  recargarDatos();

  // Login
  ge("btn-login").addEventListener("click", intentarLoginEntrenador);
  ["login-tel","login-code"].forEach(function(id){
    ge(id).addEventListener("keydown", function(e){ if(e.key==="Enter") intentarLoginEntrenador(); });
  });

  // Inicio
  ge("btn-sync-inicio").addEventListener("click",function(){ sincronizar(this, renderInicio); });
  ge("btn-checkin").addEventListener("click",abrirCheckin);
  ge("ci-input").addEventListener("keydown",function(e){if(e.key==="Enter")confirmarCI();});
  ge("ci-confirmar").addEventListener("click",confirmarCI);
  ge("ci-tab-cod").addEventListener("click",function(){ge("ci-panel-cod").style.display="block";ge("ci-panel-scan").style.display="none";this.style.background="var(--lime)";this.style.color="#080808";ge("ci-tab-scan").className="btn bd bsm";ge("ci-tab-scan").style="";detenerScanner();});
  ge("ci-tab-scan").addEventListener("click",function(){ge("ci-panel-scan").style.display="block";ge("ci-panel-cod").style.display="none";this.style.background="var(--lime)";this.style.color="#080808";ge("ci-tab-cod").className="btn bsm";ge("ci-tab-cod").style="";iniciarScanner();});

  // Socios
  ge("btn-sync-socios").addEventListener("click",function(){ sincronizar(this, renderSocios); });
  ge("soc-buscar").addEventListener("input",renderSocios);
  ge("sort-sel").addEventListener("change",function(){sortActual=this.value;renderSocios();});
  ge("btn-orden-dir").addEventListener("click",function(){ordenAsc=!ordenAsc;this.textContent=ordenAsc?"↑":"↓";renderSocios();});
  ge("btn-nuevo-soc").addEventListener("click",abrirNuevoSoc);
  ge("btn-det-back").addEventListener("click",function(){showScreen("socios");});
  ge("btn-sync-det").addEventListener("click",function(){ sincronizar(this, renderDetalle); });
  ge("btn-form-cancel").addEventListener("click",function(){showScreen("socios");});
  ge("btn-guardar-soc").addEventListener("click",guardarSoc);
  document.querySelectorAll(".tab[data-det]").forEach(function(b){b.addEventListener("click",function(){detTab=this.dataset.det;document.querySelectorAll(".tab[data-det]").forEach(function(x){x.classList.toggle("active",x.dataset.det===detTab);});renderDetalle();});});

  // Reportes (solo ventas propias)
  ge("btn-sync-rep").addEventListener("click",function(){ sincronizar(this, renderReporte); });
  ge("r-desde").addEventListener("change",renderReporte);
  ge("r-hasta").addEventListener("change",renderReporte);

  // Pago
  ge("pago-plan").addEventListener("change",function(){
    if(pagoModo==="nuevo") ge("pago-monto").value = PLAN_PRECIO[this.value]||0;
    actualizarResumenPago();
  });
  ge("pago-monto").addEventListener("input",actualizarResumenPago);
  ge("pago-inicio").addEventListener("change",actualizarResumenPago);
  ge("pago-guardar").addEventListener("click",guardarPago);
  ge("pago-cancelar").addEventListener("click",function(){ ventaEditando=null; });

  // Prod a socio
  ge("ps-producto").addEventListener("change",calcPSTot);
  ge("ps-cantidad").addEventListener("input",calcPSTot);
  ge("ps-guardar").addEventListener("click",guardarProdSoc);

  // WA
  ge("wa-tipo").addEventListener("change",previewWA);
  ge("wa-enviar").addEventListener("click",enviarWA);

  // Cerrar modales
  document.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",function(){ge(this.dataset.close).classList.remove("open");if(this.dataset.close==="modal-checkin")detenerScanner();});});
  ["modal-checkin","modal-pago","modal-prod-soc","modal-wa"].forEach(function(id){ge(id).addEventListener("click",function(e){if(e.target===this){this.classList.remove("open");if(id==="modal-checkin")detenerScanner();}});});

  var hoy=hoyISO();
  ge("r-desde").value=hoy; ge("r-hasta").value=hoy;

 }).catch(function(err){
  var errEl=ge("ov-err");
  if(errEl){ errEl.style.display="block"; errEl.textContent="Error: "+(err&&err.message?err.message:err); }
  console.error("[GymDB] Error al cargar:", err);
 });
});
</script>
